[project]
name = "agent-training-starter"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "a2a-sdk[http-server]==1.1.5",
  "agent-framework==1.19.0",
  "agent-framework-a2a==1.0.0b260918",
  "agent-framework-foundry==1.13.1",
  "azure-identity==1.25.1",
  "azure-monitor-opentelemetry-exporter==1.0.0b57",
  "python-dotenv==1.1.1",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["exercise: Aktivieren, wenn die zugehörige Übung implementiert ist"]
